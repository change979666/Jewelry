# V5.54: AI Automation Loop — cloud safety-net scheduler
#
# 主调度器是 owner 本机 Windows 计划任务（每 20 分钟，零成本）。
# 本工作流是兜底：每小时检查 Studio heartbeat；只有 stale 才接管执行。
# 两侧调用同一端点，幂等键 + 原子认领保证重复执行不会产生重复任务。
#
# 端点：POST /api/admin/v2/ai/automation（Bearer CRON_SECRET）
#   triggers — 评估触发器（新询盘/新商品），幂等创建任务
#   worker   — 消化 pending 任务（权限闸→预算闸→真实性闸→执行→验证→记录）
#
# 与 cron-pull 相同：分阶段顺序调用，避免单体请求超过 CF 边缘 100s 超时。

name: AI Automation Loop

on:
  schedule:
    # Studio 正常时只读 KV，不访问 D1；heartbeat stale 才执行接管。
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Check Studio heartbeat and take over if stale
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" --max-time 150 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Aromiso-GitHub-Fallback" \
            -d '{"mode":"fallback"}' \
            "https://aromiso.pages.dev/api/admin/v2/ai/automation")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Body: $(echo "$BODY" | head -c 1000)"
          if [ "$HTTP_CODE" -ge 400 ] && [ "$HTTP_CODE" != "524" ]; then
            echo "::error::automation fallback failed with status $HTTP_CODE"
            exit 1
          fi
