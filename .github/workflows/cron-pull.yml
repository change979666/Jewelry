# V4: Daily Google data pull (GSC + GA4 → D1 snapshots)
# Cloudflare Pages free tier lacks Cron Triggers, so we use GitHub Actions
# to hit an authenticated endpoint once per day.
#
# The endpoint /api/admin/cron-pull is protected by CRON_SECRET.
# Data pulled: T-2 (GSC has ~2 day delay).
#
# V5.361: 拆成四个阶段顺序调用（?phase=gsc/ga4/recs/growth），每阶段独立请求，
# 避免单体长请求超过 CF 边缘 100s 响应超时（error 524）导致执行被掐断、
# 任务卡在 running。每阶段有独立幂等键，失败互不影响。
# V5.38: 增加第五阶段 backfill——历史缺数按日补拉（GSC 自 8-01 / GA4 自 8-16），
# 每次调用每源补最旧一天，空日次日自动重试。

name: Cron Pull Google Data

on:
  schedule:
    # UTC 22:00 = Beijing 06:00 (next day) — Beijing-morning window (V5.20),
    # runs just before the OS pipeline so fresh GSC T-2 data feeds the Analyst.
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual trigger for testing

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-pull endpoint (4 phases)
        run: |
          # V5.13: 浏览器 UA——CF 边缘对 GitHub 数据中心 IP 发 JS 挑战（403），请求到不了 Function。
          # V5.15: 改用 pages.dev 别名——aromiso.com 区的边缘 IP 信誉挑战连 WAF Skip 规则都跳不过，
          # 而 *.pages.dev 是 CF 自有域、不挂 aromiso.com 区的安全产品，同一部署同一绑定；
          # 端点本身有 Bearer 保护，安全不降级。
          # V5.361: 四阶段顺序执行；单阶段失败记录但不中断后续阶段，最后统一判定。
          FAILED=""
          for PHASE in gsc ga4 backfill recs growth; do
            echo "=== Phase: $PHASE ==="
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              "https://aromiso.pages.dev/api/admin/cron-pull?phase=$PHASE")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP status: $HTTP_CODE"
            echo "Body: $(echo "$BODY" | head -c 500)"
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::cron-pull phase=$PHASE failed with status $HTTP_CODE"
              FAILED="$FAILED $PHASE"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::cron-pull failed phases:$FAILED"
            exit 1
          fi
