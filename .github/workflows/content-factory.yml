name: content-factory

# V5.69 — 每日 AI 内容工厂（无人值守）：Creator→Gates→Governance Reviewer→AutoPublish→Verify。
# 闸门：site_settings.content_factory_live=on + content_auto_publish=on（设置页可关）
#       + 预算硬闸 + Fact/Quality/Safety 闸 + Governance Reviewer 白名单 + 每日成功发布上限10。
#
# 同步档：POST 直接返回最终业务状态（实测同步链路可在边缘超时内完成；异步 waitUntil 档
#         在本 Pages 环境不可靠，故 cron 用同步）。
# 业务状态：SUCCESS / PARTIAL / STARVED / REJECTED / FAILED / VERIFY_FAILED。
#   FAILED / VERIFY_FAILED / UNKNOWN(响应不可解析) → exit 1 标红（禁止 silent success）。
#   SUCCESS / PARTIAL / STARVED / REJECTED → 通过但打 ::notice:: 标注明确业务状态。
on:
  schedule:
    - cron: "0 21 * * *" # 每日 21:00 UTC = 北京 05:00
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily content generation (sync, auto-publish pipeline)
        id: factory
        run: |
          RESP=$(curl -sS --max-time 300 -X POST "https://aromiso.pages.dev/api/admin/content-generate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 10}' || echo '{"status":"UNKNOWN","error":"curl failed"}')
          echo "raw response: $RESP"
          STATUS=$(printf '%s' "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.status||'UNKNOWN')}catch(e){console.log('UNKNOWN')}})")
          echo "factory_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::notice::content-factory business status = $STATUS"
          if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "VERIFY_FAILED" ] || [ "$STATUS" = "UNKNOWN" ]; then
            echo "::error::content-factory status=$STATUS — real failure / unparseable response (NOT a silent success)"
            exit 1
          fi
          echo "content-factory completed with business status: $STATUS"
