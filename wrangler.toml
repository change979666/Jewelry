# ============================================================================
#  Jewelry DTC — Cloudflare Pages configuration (V1.0)
#  Completely isolated from the legacy Aromiso project: new D1 / R2 / KV.
#
#  Bindings below are read by `wrangler pages deploy` / Workers Builds.
#  After any change here, push to main → Cloudflare Pages applies bindings.
# ============================================================================

name = "jewelry"
pages_build_output_dir = "dist"

# Workers Builds reads this from wrangler.toml (BETA). Without it the Git
# integration skips the build step and fails on the missing dist/ directory.
[build]
command = "npm run build"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]  # Astro SSR + Web Crypto need nodejs_compat

# KV namespace for CMS drafts (rate-limit / token cache)
[[kv_namespaces]]
binding = "DRAFTS"
id = "ff88490bc647479ab03290014c971056"

# D1 database — Jewelry Commerce Core
[[d1_databases]]
binding = "DB"
database_name = "jewelry-db"
database_id = "a820e393-3744-478e-9a1b-9e9fb1e80363"
migrations_dir = "migrations"

# R2 bucket — product & media images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "jewelry-images"
